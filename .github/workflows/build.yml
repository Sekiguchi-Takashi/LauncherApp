name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret KEYSTORE_B64 is not set"
            exit 1
          fi
          mkdir -p ci
          printf '%s' "$KEYSTORE_B64" | base64 -d > ci/appathy.keystore
      - name: Build
        env:
          APPATHY_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$APPATHY_STORE_PASS" ]; then
            echo "::error::secret KEYSTORE_PASSWORD is not set"
            exit 1
          fi
          gradle assembleDebug
      - name: Verify signer
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Remove keystore
        if: always()
        run: rm -f ci/appathy.keystore
